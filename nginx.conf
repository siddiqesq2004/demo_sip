# CREDORA Production Nginx Reverse Proxy Configuration
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Serve React Frontend Build static files
    location / {
        root /var/www/credora/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to PM2 Express Backend Node Service
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static File Uploads
    location /uploads/ {
        alias /var/www/credora/backend/uploads/;
    }
}
